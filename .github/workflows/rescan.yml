# Optional: more frequent rescans than Vercel Hobby's once-a-day cron.
# Set repository secrets SIGNALGUARD_URL (https://your-app.vercel.app) and CRON_SECRET to enable.
name: Scheduled rescans
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - name: Run due scans
        env:
          URL: ${{ secrets.SIGNALGUARD_URL }}
          TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then echo "SIGNALGUARD_URL or CRON_SECRET not set; skipping"; exit 0; fi
          curl --fail-with-body -sS -m 300 -H "Authorization: Bearer $TOKEN" "$URL/api/internal/cron"
